<!DOCTYPE html>
<html>
<head>
    <title>IMPRESS DESIGN - Login</title>
</head>

<body>

<h1>User Login</h1>

<input type="email" id="email" placeholder="Email"><br><br>

<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyACcRfBEEakwTxevhlwFU5HrYabef4jbNQ",
  authDomain: "impress-design-6b8a8.firebaseapp.com",
  projectId: "impress-design-6b8a8",
  storageBucket: "impress-design-6b8a8.firebasestorage.app",
  messagingSenderId: "740188914878",
  appId: "1:740188914878:web:24b1dd365c2f46a5d74aef"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


window.login = function(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;


signInWithEmailAndPassword(auth,email,password)

.then((userCredential)=>{

let user = userCredential.user;

if(user.emailVerified){

alert("Login Successful");
window.location.href="dashboard.html";

}else{

alert("Please verify your email first.");

}

})
.catch((error)=>{
alert(error.message);
});

}

</script>

</body>
</html>
