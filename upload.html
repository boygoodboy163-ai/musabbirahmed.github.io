<!DOCTYPE html>
<html>

<head>

<title>IMPRESS DESIGN - Upload Design</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>IMPRESS DESIGN</h1>

<p>Upload New Design</p>

</header>




<section>


<h2>Add Design</h2>



<div class="card">


<label>
Design Category
</label>

<br><br>


<select id="category">

<option>
Custom Frame Design
</option>

<option>
Birth Frame Design
</option>

<option>
Banner Design
</option>

</select>



<br><br>



<label>
Select JPG Image
</label>

<br><br>


<input 
type="file" 
id="imageInput"
accept=".jpg,.jpeg"
>



<br><br>



<img 
id="preview"
width="300"
style="display:none;border-radius:10px;"
>



<br><br>



<button onclick="previewImage()">

Preview Design

</button>



</div>


</section>





<script>


function previewImage(){


let file =
document.getElementById("imageInput").files[0];



if(!file){

alert("Please select JPG image");

return;

}



if(file.type !== "image/jpeg"){

alert("Only JPG image allowed");

return;

}



let reader = new FileReader();



reader.onload=function(e){


let preview =
document.getElementById("preview");


preview.src=e.target.result;


preview.style.display="block";


}



reader.readAsDataURL(file);



}



</script>



</body>

</html>
