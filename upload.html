<!DOCTYPE html>
<html>

<head>

<title>IMPRESS DESIGN - Upload Design</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>IMPRESS DESIGN</h1>

<p>
Upload New Design
</p>

</header>




<nav>

<a href="index.html">
🏠
<span>Home</span>
</a>


<a href="portfolio.html">
🎨
<span>Portfolio</span>
</a>


<a href="admin.html">
⚙️
<span>Admin</span>
</a>


</nav>




<section>


<div class="card">


<h2>🎨 Add New Design</h2>



<label>
Design Name
</label>

<br>

<input 
type="text"
id="designName"
placeholder="Example: Custom Frame Design"
>


<br><br>



<label>
Category
</label>

<br>


<select id="category">


<option>
Custom Frame Design
</option>


<option>
Birth Frame Design
</option>


<option>
Banner Design
</option>


</select>



<br><br>



<label>
Price (BDT)
</label>

<br>


<input 
type="number"
id="price"
placeholder="Example: 500"
>



<br><br>



<label>
Select JPG Image
</label>


<br><br>


<input 
type="file"
id="imageInput"
accept=".jpg,.jpeg"
>



<br><br>



<img 
id="preview"
width="300"
style="display:none;border-radius:15px;"
>



<br><br>



<button onclick="previewImage()">

Preview Design

</button>



</div>


</section>






<script>


function previewImage(){


let file =
document.getElementById("imageInput").files[0];



if(!file){

alert("Please select JPG image");

return;

}



if(file.type !== "image/jpeg"){

alert("Only JPG image allowed");

return;

}



let reader=new FileReader();



reader.onload=function(e){


let img=document.getElementById("preview");


img.src=e.target.result;


img.style.display="block";


}



reader.readAsDataURL(file);



}



</script>



</body>

</html>
